services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zenos
      POSTGRES_PASSWORD: zenos
      POSTGRES_DB: zenos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://zenos:zenos@db:5432/zenos
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a private random value of at least 32 characters}
      BACKEND_CORS_ORIGINS: http://localhost:5173
    depends_on:
      - db
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
